<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GMT | MONITOR ESTRATÉGICO</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; -webkit-tap-highlight-color: transparent; }
        
        .bg-main-dark { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); }
        .bg-movistar { background: linear-gradient(135deg, #065f46 0%, #10b981 100%); }
        .bg-gmt { background: linear-gradient(135deg, #9a3412 0%, #f97316 100%); }
        
        .glass-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
        .stat-label { font-size: 0.65rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; }
        .sup-card { border: 1px solid #e2e8f0; border-radius: 2.5rem; background: white; overflow: hidden; }
        
        /* Fix para iOS: Evita que el contenedor de recargas colapse */
        #recarga_list > div { flex: 0 0 auto; min-width: 140px; }
        
        /* Inmovilizar gráficas para que no se muevan al tocar */
        .js-plotly-plot .plotly .cursor-crosshair { cursor: default !important; }
        
        #login-screen { background: #0f172a; display: flex; align-items: center; justify-content: center; position: fixed; inset: 0; z-index: 100; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="login-screen">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-[90%] max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-black uppercase italic py-2">
                    <span class="text-orange-500">GMT</span> <span class="text-blue-800">ACCESO</span>
                </h1>
            </div>
            <div class="space-y-4">
                <input type="text" id="user" placeholder="Usuario" class="w-full p-4 rounded-2xl bg-slate-50 border outline-none focus:ring-2 focus:ring-blue-500 font-bold">
                <input type="password" id="pass" placeholder="Contraseña" class="w-full p-4 rounded-2xl bg-slate-50 border outline-none focus:ring-2 focus:ring-blue-500 font-bold">
                <button onclick="checkLogin()" class="w-full bg-blue-800 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 uppercase">INGRESAR</button>
                <p id="login-err" class="text-red-500 text-xs font-black text-center hidden">ERROR DE ACCESO</p>
            </div>
        </div>
    </div>

    <div id="dashboard-content" class="max-w-7xl mx-auto hidden">
        <header class="flex flex-col lg:flex-row justify-between items-center gap-6 mb-10 text-center lg:text-left">
            <div>
                <h1 class="text-5xl md:text-6xl font-black tracking-tighter uppercase italic py-2" style="filter: drop-shadow(0px 8px 6px rgba(0,0,0,0.1));">
                    <span style="background: linear-gradient(180deg, #ff9d42 0%, #ff6b00 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 1px 1px 0px #b45309;">GMT</span>
                    <span style="background: linear-gradient(180deg, #58a5ff 0%, #0056ce 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 1px 1px 0px #1e40af; margin-left: 2px;">PREPAGO</span>
                </h1>
                <p class="text-slate-400 font-bold text-[10px] uppercase tracking-[0.4em]">Análisis de Eficiencia | 2026</p>
            </div>
            <label class="bg-blue-800 px-8 py-3 rounded-xl text-xs font-black cursor-pointer text-white shadow-lg active:scale-95">
                📂 ACTUALIZAR CSV <input type="file" id="local_file" accept=".csv" class="hidden">
            </label>
        </header>

        <div class="glass-card rounded-[2.5rem] md:rounded-[3rem] overflow-hidden mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 text-white text-center font-black italic">
                <div class="bg-main-dark p-8 md:p-10 border-b md:border-b-0 md:border-r border-white/10">
                    <p class="stat-label text-blue-200 mb-2">Ventas Brutas</p>
                    <h2 id="k_bruto" class="text-6xl md:text-7xl leading-none">0</h2>
                </div>
                <div class="bg-movistar p-8 md:p-10 border-b md:border-b-0 md:border-r border-white/10">
                    <p class="stat-label text-emerald-100 mb-2">Meta Movistar (509)</p>
                    <h2 id="k_cumplimiento_509" class="text-5xl md:text-6xl">0%</h2>
                </div>
                <div class="bg-gmt p-8 md:p-10">
                    <p class="stat-label text-orange-100 mb-2">Meta GMT (604)</p>
                    <h2 id="k_cumplimiento_604" class="text-5xl md:text-6xl">0%</h2>
                </div>
            </div>
            <div class="p-6 md:p-10 grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-8 text-center bg-white">
                <div class="border-r border-slate-100">
                    <p class="stat-label text-blue-600 mb-1">Altas</p>
                    <span id="alta_rel" class="text-3xl md:text-4xl font-black">0%</span>
                </div>
                <div class="md:border-r border-slate-100">
                    <p class="stat-label text-orange-500 mb-1">Tráfico</p>
                    <span id="trafico_rel" class="text-3xl md:text-4xl font-black">0%</span>
                </div>
                <div class="border-r border-slate-100">
                    <p class="stat-label text-blue-400 mb-1">ARPU</p>
                    <span id="k_arpu" class="text-3xl md:text-4xl font-black">$0</span>
                </div>
                <div>
                    <p class="stat-label text-emerald-500 mb-1">Enrolado</p>
                    <span id="enrol_rel_main" class="text-3xl md:text-4xl font-black">0%</span>
                </div>
            </div>
        </div>

        <div class="glass-card p-4 md:p-8 rounded-[2rem] mb-8 overflow-hidden">
            <div id="g_tendencia" style="height: 350px; width: 100%;"></div>
        </div>

        <div class="glass-card rounded-[2rem] p-6 border-t-4 border-orange-500 mb-12">
            <h4 class="stat-label mb-6 text-center text-slate-800">Distribución de Recargas</h4>
            <div id="recarga_list" class="flex md:grid md:grid-cols-4 gap-4 overflow-x-auto pb-2"></div>
        </div>

        <div id="supervisor_grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-20"></div>
    </div>

    <script>
        const USER_AUTH = "DIRECCION";
        const PASS_AUTH = "Gmt@2026*";
        let globalData = [];

        function checkLogin() {
            if(document.getElementById('user').value === USER_AUTH && document.getElementById('pass').value === PASS_AUTH) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');
                autoLoadCSV(); 
            } else { document.getElementById('login-err').classList.remove('hidden'); }
        }

        async function autoLoadCSV() {
            try {
                const response = await fetch('data.csv?v=' + Date.now());
                if (!response.ok) return;
                const text = await response.text();
                processData(text);
            } catch (e) { console.error("Error CSV"); }
        }

        document.getElementById('local_file').onchange = e => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = evt => processData(evt.target.result);
            reader.readAsText(file);
        };

        function processData(text) {
            const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
            const sep = lines[0].includes(';') ? ';' : ',';
            globalData = lines.slice(1).map(line => {
                const c = line.split(sep).map(x => x.replace(/['"]+/g, '').trim());
                if (!c[0]) return null;
                let m = 0; if(c[7] && !c[7].toUpperCase().includes("SIN")) m = parseFloat(c[7].replace(/[^0-9.]/g, '')) || 0;
                const esAlta = c[3] && !c[3].toUpperCase().includes("SIN");
                const esTrafico = c[6] && c[6].toUpperCase().includes("TRAFICO");
                const esEnrolado = c[8] && c[8].toUpperCase().includes("ENROL");
                return { fVenta: c[1], supervisor: c[2] || "S/S", esAlta, esTrafico, esEnrolado, recargaTxt: c[7] || "SIN RECARGA", recargaVal: m };
            }).filter(d => d !== null);
            render();
        }

        function render() {
            const total = globalData.length;
            const dates = [...new Set(globalData.map(d => d.fVenta))].sort();
            const dias = dates.length || 1;

            document.getElementById('k_bruto').innerText = total;
            document.getElementById('k_cumplimiento_509').innerText = Math.round((total/(dias*509))*100) + "%";
            document.getElementById('k_cumplimiento_604').innerText = Math.round((total/(dias*604))*100) + "%";
            document.getElementById('alta_rel').innerText = Math.round((globalData.filter(d=>d.esAlta).length/total)*100) + "%";
            document.getElementById('trafico_rel').innerText = Math.round((globalData.filter(d=>d.esTrafico).length/total)*100) + "%";
            document.getElementById('enrol_rel_main').innerText = Math.round((globalData.filter(d=>d.esEnrolado).length/total)*100) + "%";
            
            const recs = globalData.filter(d => d.recargaVal > 0);
            document.getElementById('k_arpu').innerText = "$" + (recs.length > 0 ? Math.round(recs.reduce((s,d)=>s+d.recargaVal,0)/recs.length) : 0);

            // GRÁFICA CON INTERACCIÓN DESACTIVADA (Inmóvil)
            const counts = dates.map(dt => globalData.filter(d => d.fVenta === dt).length);
            Plotly.newPlot('g_tendencia', [
                { x: dates, y: counts, type: 'scatter', mode: 'lines+markers+text', text: counts, textposition: 'top center', line: {color: '#1e3a8a', width: 3, shape: 'spline'} },
                { x: dates, y: dates.map(() => 604), name: 'Meta GMT', line: {color: '#f97316', dash: 'dash'} },
                { x: dates, y: dates.map(() => 509), name: 'Meta Movistar', line: {color: '#10b981', dash: 'dash'} }
            ], { 
                paper_bgcolor: 'rgba(0,0,0,0)', 
                plot_bgcolor: 'rgba(0,0,0,0)', 
                margin: {t:30, r:20, b:40, l:30},
                showlegend: false
            }, { 
                staticPlot: true, // ESTO INMOVILIZA LA GRÁFICA COMPLETAMENTE
                responsive: true 
            });

            // RECARGAS (Forzando visualización)
            const recMap = {};
            globalData.forEach(d => { recMap[d.recargaTxt] = (recMap[d.recargaTxt] || 0) + 1; });
            document.getElementById('recarga_list').innerHTML = Object.entries(recMap).sort((a,b)=>b[1]-a[1]).map(([l,v]) => `
                <div class="p-4 bg-slate-50 rounded-2xl flex flex-col items-center border border-slate-100 flex-shrink-0">
                    <p class="text-[9px] font-black uppercase text-slate-400 mb-1 text-center">${l}</p>
                    <p class="text-xl font-black text-slate-800">${v}</p>
                </div>`).join('');

            // SUPERVISORES
            const supers = [...new Set(globalData.map(d => d.supervisor))].sort();
            document.getElementById('supervisor_grid').innerHTML = supers.map(s => {
                const dSup = globalData.filter(x => x.supervisor === s);
                const v = dSup.length;
                return `
                    <div class="sup-card p-6 shadow-sm">
                        <p class="text-[10px] font-black text-blue-900 border-b pb-2 mb-4 uppercase italic">${s}</p>
                        <p class="text-3xl font-black text-slate-800 text-center mb-4">${v}</p>
                        <div class="grid grid-cols-3 gap-1">
                            <div class="bg-blue-50 p-1 rounded-lg text-center"><p class="stat-label text-[6px]">Alta</p><p class="text-[10px] font-bold">${Math.round((dSup.filter(x=>x.esAlta).length/v)*100)||0}%</p></div>
                            <div class="bg-orange-50 p-1 rounded-lg text-center"><p class="stat-label text-[6px]">Traf</p><p class="text-[10px] font-bold">${Math.round((dSup.filter(x=>x.esTrafico).length/v)*100)||0}%</p></div>
                            <div class="bg-emerald-50 p-1 rounded-lg text-center"><p class="stat-label text-[6px]">Enrol</p><p class="text-[10px] font-bold">${Math.round((dSup.filter(x=>x.esEnrolado).length/v)*100)||0}%</p></div>
                        </div>
                    </div>`;
            }).join('');
        }
    </script>
</body>
</html>
