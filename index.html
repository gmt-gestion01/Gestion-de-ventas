<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GMT | MONITOR ESTRATÉGICO</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; }
        .bg-main-dark { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); }
        .bg-movistar { background: linear-gradient(135deg, #065f46 0%, #10b981 100%); }
        .bg-gmt { background: linear-gradient(135deg, #9a3412 0%, #f97316 100%); }
        .glass-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
        .stat-label { font-size: 0.65rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; }
        .flag-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; border: 2px solid rgba(255,255,255,0.2); }
        .sup-card { transition: all 0.2s; border: 1px solid #e2e8f0; border-radius: 2rem; background: white; }
        #login-screen { background: #0f172a; display: flex; align-items: center; justify-content: center; position: fixed; inset: 0; z-index: 100; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="login-screen">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md">
            <h2 class="text-2xl font-black text-slate-800 mb-6 text-center uppercase italic">Acceso Restringido</h2>
            <div class="space-y-4">
                <input type="text" id="user" placeholder="Usuario" class="w-full p-4 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
                <input type="password" id="pass" placeholder="Contraseña" class="w-full p-4 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="checkLogin()" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl hover:bg-blue-700 transition-all">INGRESAR</button>
                <p id="login-err" class="text-red-500 text-xs font-bold text-center hidden">Credenciales incorrectas</p>
            </div>
        </div>
    </div>

    <div id="dashboard-content" class="max-w-7xl mx-auto hidden">
        <header class="flex flex-col lg:flex-row justify-between items-center gap-6 mb-10">
            <div class="text-center lg:text-left">
                <h1 class="text-6xl font-black tracking-tighter uppercase italic py-2">
                    <span style="background: linear-gradient(180deg, #ff9d42 0%, #ff6b00 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">GMT</span>
                    <span style="background: linear-gradient(180deg, #58a5ff 0%, #0056ce 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">PREPAGO</span>
                </h1>
                <p class="text-slate-400 font-bold text-[11px] uppercase tracking-[0.45em]">Análisis de Eficiencia | 2026</p>
            </div>
            <div class="flex gap-3">
                <label class="bg-blue-800 hover:bg-blue-700 px-8 py-3 rounded-xl text-xs font-black cursor-pointer transition-all uppercase text-white shadow-lg">
                    📂 Actualizar CSV
                    <input type="file" id="local_file" accept=".csv" class="hidden">
                </label>
            </div>
        </header>

        <div class="glass-card rounded-[3rem] overflow-hidden mb-8 shadow-xl">
            <div class="grid grid-cols-1 md:grid-cols-3 text-white text-center">
                <div class="bg-main-dark p-10 md:border-r border-white/10">
                    <p class="stat-label text-blue-200 mb-2">Ventas Brutas</p>
                    <h2 id="k_bruto" class="text-7xl font-black italic leading-none">0</h2>
                </div>
                <div class="bg-movistar p-10 md:border-r border-white/10">
                    <p class="stat-label text-emerald-100 mb-2">Meta Movistar (509)</p>
                    <h2 id="k_cumplimiento_509" class="text-6xl font-black italic">0%</h2>
                </div>
                <div class="bg-gmt p-10">
                    <p class="stat-label text-orange-100 mb-2">Meta GMT (604)</p>
                    <h2 id="k_cumplimiento_604" class="text-6xl font-black italic">0%</h2>
                </div>
            </div>
            <div class="p-10 grid grid-cols-2 md:grid-cols-4 gap-8 text-center bg-white">
                <div><p class="stat-label text-blue-600 mb-2">Altas</p><span id="alta_rel" class="text-4xl font-black">0%</span></div>
                <div><p class="stat-label text-orange-500 mb-2">Tráfico</p><span id="trafico_rel" class="text-4xl font-black">0%</span></div>
                <div><p class="stat-label text-blue-400 mb-2">ARPU</p><span id="k_arpu" class="text-4xl font-black">$0</span></div>
                <div><p class="stat-label text-emerald-500 mb-2">Enrolado</p><span id="enrol_rel_main" class="text-4xl font-black">0%</span></div>
            </div>
        </div>

        <div class="glass-card p-8 rounded-[2.5rem] mb-8">
            <div id="g_tendencia" style="height: 400px; width: 100%;"></div>
        </div>

        <div id="supervisor_grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-20"></div>
    </div>

    <script>
        const USER_AUTH = "DIRECCION";
        const PASS_AUTH = "Gmt@2026*";
        let globalData = [];

        function checkLogin() {
            if(document.getElementById('user').value === USER_AUTH && document.getElementById('pass').value === PASS_AUTH) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');
                autoLoadCSV(); // Carga automática al entrar
            } else {
                document.getElementById('login-err').classList.remove('hidden');
            }
        }

        async function autoLoadCSV() {
            try {
                const response = await fetch('data.csv?v=' + Date.now());
                if (!response.ok) return;
                const text = await response.text();
                processData(text);
            } catch (e) { console.error("Error cargando CSV inicial"); }
        }

        document.getElementById('local_file').onchange = e => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = evt => processData(evt.target.result);
            reader.readAsText(file);
        };

        function processData(text) {
            const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
            const sep = lines[0].includes(';') ? ';' : ',';
            globalData = lines.slice(1).map(line => {
                const c = line.split(sep).map(x => x.replace(/['"]+/g, '').trim());
                if (!c[0]) return null;
                
                // Limpieza de datos específica para tu archivo
                let m = 0; if(c[7] && !c[7].toUpperCase().includes("SIN")) m = parseFloat(c[7].replace(/[^0-9.]/g, '')) || 0;
                const esAlta = c[3] && !c[3].toUpperCase().includes("SIN");
                const esTrafico = c[6] && c[6].toUpperCase().includes("TRAFICO");
                const esEnrolado = c[8] && c[8].toUpperCase().includes("ENROL");

                return { fVenta: c[1], supervisor: c[2] || "S/S", esAlta, esTrafico, esEnrolado, recargaVal: m };
            }).filter(d => d !== null);
            render();
        }

        function render() {
            const total = globalData.length;
            const dates = [...new Set(globalData.map(d => d.fVenta))].sort();
            document.getElementById('k_bruto').innerText = total;
            
            // Metas (basadas en días detectados)
            const dias = dates.length || 1;
            document.getElementById('k_cumplimiento_509').innerText = Math.round((total/(dias*509))*100) + "%";
            document.getElementById('k_cumplimiento_604').innerText = Math.round((total/(dias*604))*100) + "%";

            // Porcentajes
            document.getElementById('alta_rel').innerText = Math.round((globalData.filter(d=>d.esAlta).length/total)*100) + "%";
            document.getElementById('trafico_rel').innerText = Math.round((globalData.filter(d=>d.esTrafico).length/total)*100) + "%";
            document.getElementById('enrol_rel_main').innerText = Math.round((globalData.filter(d=>d.esEnrolado).length/total)*100) + "%";
            
            const recs = globalData.filter(d => d.recargaVal > 0);
            document.getElementById('k_arpu').innerText = "$" + (recs.length > 0 ? Math.round(recs.reduce((s,d)=>s+d.recargaVal,0)/recs.length) : 0);

            // Gráfica
            const counts = dates.map(dt => globalData.filter(d => d.fVenta === dt).length);
            Plotly.newPlot('g_tendencia', [{ x: dates, y: counts, type: 'scatter', mode: 'lines+markers', line: {color: '#1e3a8a'} }], { title: 'Ventas por Día' });

            // Supervisores
            const supers = [...new Set(globalData.map(d => d.supervisor))].sort();
            document.getElementById('supervisor_grid').innerHTML = supers.map(s => {
                const dSup = globalData.filter(x => x.supervisor === s);
                return `<div class="sup-card p-6 text-center"><p class="stat-label border-b mb-2">${s}</p><p class="text-3xl font-black">${dSup.length}</p></div>`;
            }).join('');
        }
    </script>
</body>
</html>
