<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GMT | MONITOR ESTRATÉGICO</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; -webkit-tap-highlight-color: transparent; }
        
        .bg-main-dark { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); }
        .bg-movistar { background: linear-gradient(135deg, #065f46 0%, #10b981 100%); }
        .bg-gmt { background: linear-gradient(135deg, #9a3412 0%, #f97316 100%); }
        
        .glass-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
        .stat-label { font-size: 0.65rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; }
        .flag-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; border: 2px solid rgba(255,255,255,0.2); }
        .sup-card { transition: all 0.2s; border: 1px solid #e2e8f0; border-radius: 2.5rem; background: white; overflow: hidden; }

        #login-screen { background: #0f172a; display: flex; align-items: center; justify-content: center; position: fixed; inset: 0; z-index: 100; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="login-screen">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-[90%] max-w-md text-center">
            <h2 class="text-2xl font-black text-slate-800 mb-6 uppercase italic">Acceso GMT</h2>
            <div class="space-y-4">
                <input type="text" id="user" placeholder="Usuario" class="w-full p-4 rounded-2xl bg-slate-50 border outline-none font-bold">
                <input type="password" id="pass" placeholder="Contraseña" class="w-full p-4 rounded-2xl bg-slate-50 border outline-none font-bold">
                <button onclick="checkLogin()" class="w-full bg-blue-800 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 uppercase">Ingresar</button>
                <p id="login-err" class="text-red-500 text-xs font-black hidden">CREDENCIALES INCORRECTAS</p>
            </div>
        </div>
    </div>

    <div id="dashboard-content" class="max-w-7xl mx-auto hidden">
        <header class="flex flex-col lg:flex-row justify-between items-center gap-6 mb-10">
            <div class="text-center lg:text-left">
                <h1 class="text-6xl font-black tracking-tighter uppercase italic py-2" style="filter: drop-shadow(0px 10px 8px rgba(0,0,0,0.15));">
                    <span style="background: linear-gradient(180deg, #ff9d42 0%, #ff6b00 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 1px 1px 0px #b45309, 2px 2px 0px #92400e; display: inline-block;">GMT</span>
                    <span style="background: linear-gradient(180deg, #58a5ff 0%, #0056ce 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 1px 1px 0px #1e40af, 2px 2px 0px #1e3a8a; display: inline-block; margin-left: 2px;">PREPAGO</span>
                </h1>
                <p class="text-slate-400 font-bold text-[11px] uppercase tracking-[0.45em] mt-[-4px] pl-1">Análisis de Eficiencia | 2026</p>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                <select id="month_filter" onchange="render()" class="bg-white border-2 border-slate-200 px-6 py-3 rounded-xl text-xs font-black uppercase text-slate-700 outline-none shadow-sm cursor-pointer"></select>
                <label class="bg-blue-800 px-8 py-3 rounded-xl text-xs font-black cursor-pointer text-white shadow-lg text-center uppercase">
                    📂 Cargar CSV <input type="file" id="local_file" accept=".csv" class="hidden">
                </label>
            </div>
        </header>

        <div id="kpi_main_area" class="glass-card rounded-[3rem] overflow-hidden mb-8 shadow-xl"></div>

        <div class="glass-card p-8 rounded-[2.5rem] mb-8">
            <h4 class="stat-label mb-6 italic text-center text-slate-600 uppercase">Tendencia de Ventas vs Metas</h4>
            <div id="g_tendencia" style="height: 400px; width: 100%;"></div>
        </div>

        <div class="glass-card rounded-[2.5rem] p-8 border-t-4 border-orange-500 mb-12">
            <h4 class="stat-label mb-8 italic text-center text-slate-800 border-b pb-2 uppercase tracking-widest">Distribución de Recargas</h4>
            <div id="recarga_list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
        </div>

        <div class="mb-20">
            <h4 class="stat-label mb-6 italic px-4 border-l-4 border-blue-800 ml-2 uppercase text-slate-700">Monitor por Supervisor</h4>
            <div id="supervisor_grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </div>
    </div>

    <script>
        const USER_AUTH = "DIRECCION";
        const PASS_AUTH = "Gmt@2026*";
        let globalRawData = [];

        function checkLogin() {
            if(document.getElementById('user').value === USER_AUTH && document.getElementById('pass').value === PASS_AUTH) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');
                autoLoadCSV();
            } else { document.getElementById('login-err').classList.remove('hidden'); }
        }

        async function autoLoadCSV() {
            try {
                const response = await fetch('data.csv?v=' + Date.now());
                if (response.ok) processData(await response.text());
            } catch (e) { console.log("Sin archivo data.csv en servidor."); }
        }

        document.getElementById('local_file').onchange = e => {
            const reader = new FileReader();
            reader.onload = evt => processData(evt.target.result);
            reader.readAsText(e.target.files[0]);
        };

        function processData(text) {
            const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
            const sep = lines[0].includes(';') ? ';' : ',';
            const headers = lines[0].split(sep).map(h => h.trim().toUpperCase());
            const mesIdx = headers.indexOf("MES");
            
            globalRawData = lines.slice(1).map(line => {
                const c = line.split(sep).map(x => x.replace(/['"]+/g, '').trim());
                if (!c[0]) return null;
                
                // Lógica de detección según tus columnas
                const esAltaReal = c[3] && c[3].toUpperCase() !== "SIN ALTA" && c[3] !== "";
                const esActivacion = c[4] && c[4].toUpperCase().includes("ACTIVACION");
                const esTrafico = c[6] && c[6].toUpperCase().includes("TRAFICO");
                const esEnrolado = c[8] && c[8].toUpperCase().includes("ENROLADO");
                
                let recVal = 0;
                if(c[7] && !c[7].toUpperCase().includes("SIN")) recVal = parseFloat(c[7].replace(/[^0-9.]/g, '')) || 0;

                return {
                    fVenta: c[1],
                    supervisor: c[2] || "S/S",
                    esAltaReal,
                    esActivacion,
                    esTrafico,
                    esEnrolado,
                    recargaTxt: c[7] || "SIN RECARGA",
                    recargaVal: recVal,
                    mes: mesIdx !== -1 ? c[mesIdx].toLowerCase() : "febrero"
                };
            }).filter(d => d !== null);

            const meses = [...new Set(globalRawData.map(d => d.mes))].sort();
            const selector = document.getElementById('month_filter');
            selector.innerHTML = meses.map(m => `<option value="${m}">${m.toUpperCase()}</option>`).join('');
            if(meses.length > 0) selector.value = meses[meses.length - 1];

            render();
        }

        function render() {
            const selMes = document.getElementById('month_filter').value;
            const data = globalRawData.filter(d => d.mes === selMes);
            const total = data.length;
            const dates = [...new Set(data.map(d => d.fVenta))].sort();
            const dias = dates.length || 1;

            const calcMeta = (t, m) => {
                const obj = dias * m;
                const perc = Math.round((t/obj)*100) || 0;
                return { perc, gap: t - obj, color: perc >= 98 ? '#4ade80' : perc < 89 ? '#f87171' : '#fbbf24' };
            };
            const mov = calcMeta(total, 509);
            const gmt = calcMeta(total, 604);

            // KPIs con indicador de UNIDADES (Registros)
            document.getElementById('kpi_main_area').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 text-white text-center italic font-black">
                    <div class="bg-main-dark p-10 md:border-r border-white/10">
                        <p class="text-[10px] font-black uppercase tracking-[0.2em] text-blue-200 mb-2">Ventas Brutas</p>
                        <h2 class="text-7xl leading-none">${total}</h2>
                        <span class="text-[11px] font-bold text-blue-300/80 uppercase italic">Unidades Totales</span>
                    </div>
                    <div class="bg-movistar p-10 md:border-r border-white/10">
                        <p class="text-[10px] font-black uppercase tracking-[0.2em] text-emerald-100 mb-2">Meta Movistar</p>
                        <div class="flex flex-col items-center">
                            <div class="flex items-center mb-1"><span class="flag-dot" style="background:${mov.color}"></span><h2 class="text-6xl">${mov.perc}%</h2></div>
                            <span class="text-3xl text-white/90">${(mov.gap >= 0 ? "+" : "") + mov.gap}</span>
                        </div>
                    </div>
                    <div class="bg-gmt p-10">
                        <p class="text-[10px] font-black uppercase tracking-[0.2em] text-orange-100 mb-2">Meta GMT</p>
                        <div class="flex flex-col items-center">
                            <div class="flex items-center mb-1"><span class="flag-dot" style="background:${gmt.color}"></span><h2 class="text-6xl">${gmt.perc}%</h2></div>
                            <span class="text-3xl text-white/90">${(gmt.gap >= 0 ? "+" : "") + gmt.gap}</span>
                        </div>
                    </div>
                </div>
                <div class="p-10 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-6 text-center bg-white">
                    <div class="border-r border-slate-100">
                        <p class="stat-label text-blue-600 mb-2">Activación</p>
                        <span class="text-4xl font-black text-slate-800">${total>0?Math.round((data.filter(d=>d.esActivacion).length/total)*100):0}%</span>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">${data.filter(d=>d.esActivacion).length} Registros</p>
                    </div>
                    <div class="md:border-r border-slate-100">
                        <p class="stat-label text-blue-800 mb-2">Alta Real</p>
                        <span class="text-4xl font-black text-slate-800">${total>0?Math.round((data.filter(d=>d.esAltaReal).length/total)*100):0}%</span>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">${data.filter(d=>d.esAltaReal).length} Registros</p>
                    </div>
                    <div class="border-r border-slate-100">
                        <p class="stat-label text-orange-500 mb-2">Tráfico</p>
                        <span class="text-4xl font-black text-slate-800">${total>0?Math.round((data.filter(d=>d.esTrafico).length/total)*100):0}%</span>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">${data.filter(d=>d.esTrafico).length} Registros</p>
                    </div>
                    <div class="border-r border-slate-100">
                        <p class="stat-label text-blue-400 mb-2">ARPU</p>
                        <span class="text-4xl font-black text-slate-800">$${data.filter(d=>d.recargaVal>0).length > 0 ? Math.round(data.filter(d=>d.recargaVal>0).reduce((s,d)=>s+d.recargaVal,0)/data.filter(d=>d.recargaVal>0).length) : 0}</span>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">${data.filter(d=>d.recargaVal>0).length} Recargados</p>
                    </div>
                    <div>
                        <p class="stat-label text-emerald-500 mb-2">Enrolado</p>
                        <span class="text-4xl font-black text-slate-800">${total>0?Math.round((data.filter(d=>d.esEnrolado).length/total)*100):0}%</span>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">${data.filter(d=>d.esEnrolado).length} Registros</p>
                    </div>
                </div>`;

            // Gráfica
            const counts = dates.map(dt => data.filter(d => d.fVenta === dt).length);
            Plotly.newPlot('g_tendencia', [
                { x: dates, y: counts, type: 'scatter', mode: 'lines+markers+text', text: counts, textposition: 'top center', line: {color: '#1e3a8a', width: 3, shape: 'spline'} },
                { x: dates, y: dates.map(() => 604), name: 'Meta GMT', line: {color: '#f97316', dash: 'dash'} }
            ], { paper_bgcolor: 'rgba(0,0,0,0)', margin: {t:30, b:40, l:40, r:20}, showlegend: false }, {responsive: true});

            // Recargas
            const recMap = {};
            data.forEach(d => { recMap[d.recargaTxt] = (recMap[d.recargaTxt] || 0) + 1; });
            document.getElementById('recarga_list').innerHTML = Object.entries(recMap).sort((a,b)=>b[1]-a[1]).map(([l,v]) => `
                <div class="p-4 bg-slate-50 rounded-2xl flex justify-between items-center border border-slate-100 shadow-sm">
                    <div><p class="text-[10px] font-black text-slate-400 uppercase leading-none mb-1">${l}</p><p class="text-[12px] font-bold text-blue-500">${Math.round((v/total)*100)}%</p></div>
                    <p class="text-lg font-black text-slate-800">${v}</p>
                </div>`).join('');

            // Supervisores
            const supers = [...new Set(data.map(d => d.supervisor))].sort();
            document.getElementById('supervisor_grid').innerHTML = supers.map(s => {
                const dSup = data.filter(x => x.supervisor === s);
                const v = dSup.length;
                return `
                    <div class="sup-card p-6 shadow-sm border border-slate-100">
                        <p class="text-[11px] font-black text-blue-900 border-b pb-2 mb-4 uppercase italic text-center">${s}</p>
                        <p class="text-3xl font-black text-slate-800 text-center mb-4">${v}</p>
                        <div class="grid grid-cols-3 gap-2">
                            <div class="bg-blue-50 p-2 rounded-xl text-center"><p class="stat-label text-[6px]">Act.</p><p class="text-[10px] font-black">${Math.round((dSup.filter(x=>x.esActivacion).length/v)*100)||0}%</p></div>
                            <div class="bg-orange-50 p-2 rounded-xl text-center"><p class="stat-label text-[6px]">Traf.</p><p class="text-[10px] font-black">${Math.round((dSup.filter(x=>x.esTrafico).length/v)*100)||0}%</p></div>
                            <div class="bg-emerald-50 p-2 rounded-xl text-center"><p class="stat-label text-[6px]">Enrol.</p><p class="text-[10px] font-black">${Math.round((dSup.filter(x=>x.esEnrolado).length/v)*100)||0}%</p></div>
                        </div>
                    </div>`;
            }).join('');
        }
    </script>
</body>
</html>
